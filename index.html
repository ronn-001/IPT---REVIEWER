<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPT101 Quiz Reviewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap');

  :root{
    --bg: #14161c;
    --panel: #1c1f28;
    --panel-raised: #232733;
    --line: #2e3340;
    --text: #dfe3ee;
    --muted: #8890a4;
    --accent: #6ee7b7;
    --accent-dim: #3a5c4d;
    --wrong: #f28b82;
    --wrong-dim: #5c3a3a;
    --gold: #f2c46d;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Source Sans 3', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 32px 16px 60px;
  }

  .wrap{ width:100%; max-width: 700px; }

  .brand{
    display:flex;
    align-items: baseline;
    gap:10px;
    margin-bottom: 22px;
  }
  .brand .tag{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .brand h1{
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    margin: 2px 0 0;
    color: var(--text);
  }
  .brand h1 span{ color: var(--accent); }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 26px 22px;
  }

  /* ---- intro screen ---- */
  #intro p{
    color: var(--muted);
    line-height: 1.6;
    font-size: 15px;
  }
  #intro .stats{
    display:flex;
    gap:14px;
    margin: 18px 0 22px;
    flex-wrap: wrap;
  }
  .stat{
    font-family: var(--mono);
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
  }
  .stat b{ display:block; font-size: 18px; color: var(--accent); }

  button.primary{
    font-family: var(--mono);
    background: var(--accent);
    color: #0c1410;
    border: none;
    font-weight: 700;
    font-size: 14.5px;
    padding: 13px 22px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  button.primary:hover{ filter: brightness(1.08); }
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; filter:none; }

  button.ghost{
    font-family: var(--mono);
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
  }
  button.ghost:hover{ border-color: var(--accent); color: var(--accent); }

  /* ---- progress ---- */
  #quizScreen{ display:none; }
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .progress-track{
    height: 5px;
    width:100%;
    background: var(--panel-raised);
    border-radius: 4px;
    overflow:hidden;
    margin-bottom: 22px;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    width:0%;
    transition: width 0.25s ease;
  }

  .qtopic{
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .qtext{
    font-size: 17px;
    line-height: 1.5;
    margin: 0 0 20px;
    color: var(--text);
  }
  .qtext code{
    font-family: var(--mono);
    background: var(--panel-raised);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    color: var(--gold);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom: 22px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 13px 15px;
    border-radius: 8px;
    cursor:pointer;
    font-size: 14.5px;
    font-family: var(--sans);
    line-height: 1.45;
  }
  .opt:hover:not(.locked){ border-color: var(--accent); }
  .opt .letter{
    font-family: var(--mono);
    font-weight:700;
    color: var(--muted);
    flex-shrink:0;
  }
  .opt code{
    font-family: var(--mono);
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.92em;
    color: var(--gold);
  }
  .opt.correct{
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .opt.correct .letter{ color: var(--accent); }
  .opt.wrong{
    border-color: var(--wrong);
    background: var(--wrong-dim);
  }
  .opt.wrong .letter{ color: var(--wrong); }
  .opt.locked{ cursor:default; }

  .feedback{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    min-height: 20px;
    margin-bottom: 18px;
  }
  .feedback.correct{ color: var(--accent); }
  .feedback.wrong{ color: var(--wrong); }

  .nav-row{ display:flex; justify-content:flex-end; }

  /* ---- results ---- */
  #resultScreen{ display:none; text-align:center; }
  #resultScreen .score-big{
    font-family: var(--mono);
    font-size: 56px;
    font-weight: 800;
    color: var(--accent);
    margin: 6px 0 2px;
  }
  #resultScreen .score-sub{
    font-family: var(--mono);
    color: var(--muted);
    font-size: 13.5px;
    margin-bottom: 22px;
  }
  #resultScreen .verdict{
    font-size: 16px;
    margin-bottom: 22px;
    color: var(--text);
  }
  .breakdown{
    text-align:left;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 22px;
    max-height: 320px;
    overflow-y:auto;
  }
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    gap: 10px;
    font-size: 13px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
  }
  .breakdown-row:last-child{ border-bottom:none; }
  .breakdown-row .r-topic{ color: var(--text); }
  .breakdown-row .r-mark{ flex-shrink:0; }
  .breakdown-row.miss .r-mark{ color: var(--wrong); }
  .breakdown-row.hit .r-mark{ color: var(--accent); }

  .result-actions{ display:flex; gap:12px; justify-content:center; }

  @media (max-width: 520px){
    .card{ padding: 20px 18px; }
    #resultScreen .score-big{ font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <span class="tag">IPT101 //</span>
    <h1>Integrative Programming <span>Reviewer</span></h1>
  </div>

  <div class="card">

    <div id="intro">
      <p>50 questions covering methods, arrays, Swing components, layout managers, and OOP fundamentals — pulled straight from your midterm notes.</p>
      <div class="stats">
        <div class="stat"><b>50</b>questions</div>
        <div class="stat"><b>4</b>choices each</div>
        <div class="stat"><b>∞</b>retries</div>
      </div>
      <button class="primary" onclick="startQuiz()">Start reviewer</button>
    </div>

    <div id="quizScreen">
      <div class="progress-row">
        <span id="qCounter">Question 1 / 50</span>
        <span id="qScoreLive">Score: 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

      <div class="qtopic" id="qTopic">TOPIC</div>
      <p class="qtext" id="qText">Question text</p>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedback"></div>

      <div class="nav-row">
        <button class="primary" id="nextBtn" onclick="nextQuestion()" disabled>Next question</button>
      </div>
    </div>

    <div id="resultScreen">
      <div class="qtopic" style="text-align:left">RESULT</div>
      <div class="score-big" id="scoreBig">0%</div>
      <div class="score-sub" id="scoreSub">0 / 50 correct</div>
      <div class="verdict" id="verdict"></div>
      <div class="breakdown" id="breakdown"></div>
      <div class="result-actions">
        <button class="primary" onclick="restartQuiz()">Retry quiz</button>
      </div>
    </div>

  </div>
</div>

<script>
const QUESTIONS = [
{t:"Purpose of a Method", q:"What is the primary purpose of a method in Java?", o:["To perform a specific task or operation","To declare variables only","To import packages","To create a compiler"], c:0},

{t:"Method Return Type", q:"What does the return type in a method declaration specify?", o:["The method's name","The type of value returned by the method","The number of parameters","The access modifier"], c:1},

{t:"Returning Sum of Integers", q:"Which method correctly returns the sum of two integers?", o:["<code>void add(int a, int b) { a + b; }</code>","<code>int add(int a, int b) { return a + b; }</code>","<code>int add() { return a + b; }</code>","<code>String add(int a, int b) { a + b; }</code>"], c:1},

{t:"Method Parameters", q:"What is the purpose of a parameter in a method?", o:["To store the return value","To receive data that can be used by the method","To define the class name","To end the program"], c:1},

{t:"Calling a Static Method", q:"How is a static method named <code>greet()</code> called?", o:["<code>greet;</code>","<code>call greet();</code>","<code>greet();</code>","<code>new greet();</code>"], c:2},

{t:"Void Return Type", q:"What does a method with a void return type do?", o:["Returns an integer","Returns a string","Does not return a value","Always returns null"], c:2},

{t:"Method Execution Output", q:"Passing 4 to a method that returns the square of its input displays:", o:["4","8","16","12"], c:2},

{t:"Displaying Parameters", q:"Which method declaration accepts a student's name and displays it?", o:["<code>int display(name)</code>","<code>void display(String name) { System.out.println(name); }</code>","<code>void display() { System.out.println(name); }</code>","<code>String display(name) { print(name); }</code>"], c:1},

{t:"Code Reusability", q:"To reuse the same calculation in several parts of a program, the best approach is to:", o:["Copy and paste the code everywhere","Create a method containing the calculation","Write it as a comment","Use a static variable only"], c:1},

{t:"Method Overloading", q:"Method overloading is defined as:", o:["Defining methods with the same name but different parameter lists","Defining methods with different names","Overwriting a method in a subclass","Deleting unused methods"], c:0},

{t:"Array Declaration", q:"Which declaration creates an array capable of storing five integers?", o:["<code>int numbers = new int[5];</code>","<code>int[] numbers = new int[5];</code>","<code>int[5] numbers = new int;</code>","<code>array numbers = int[5];</code>"], c:1},

{t:"Array Indexing", q:"What is the index of the first element in a Java array?", o:["1","-1","0","It depends on the array"], c:2},

{t:"Accessing Array Elements", q:"Given <code>scores = {80, 85, 90, 95}</code>, which expression accesses the value 90?", o:["<code>scores[3]</code>","<code>scores[1]</code>","<code>scores[2]</code>","<code>scores[90]</code>"], c:2},

{t:"Array Length Property", q:"What does the length property of an array provide?", o:["The sum of all elements","The number of elements in the array","The last element's value","The data type of the array"], c:1},

{t:"Array Index Out of Bounds", q:"Accessing index 3 of a three-element array causes:", o:["A compile error","An ArrayIndexOutOfBoundsException","The value 0 to be returned","Nothing, it's valid"], c:1},

{t:"Array Traversal", q:"Which loop is commonly used to process every element of an array?", o:["if statement","for loop","switch statement","try-catch block"], c:1},

{t:"Array Output", q:"Printing each element of the array {2, 4, 6, 8} sequentially displays:", o:["8 6 4 2","2 4 6 8","\"2, 4, 6, 8\" as one string only","An error"], c:1},

{t:"2D Array Declaration", q:"Which declaration creates a two-dimensional integer array with 3 rows and 4 columns?", o:["<code>int[] data = new int[3,4];</code>","<code>int[][] data = new int[3][4];</code>","<code>int[][] data = new int[4][3];</code>","<code>int data[3][4];</code>"], c:1},

{t:"Choosing Data Structures", q:"To store the grades of 50 students in one subject, the most appropriate structure is:", o:["A single integer variable","An integer array with 50 elements","A 2D array with 50 rows and 50 columns","A JButton"], c:1},

{t:"Summing Array Elements", q:"Summing the elements of the array {5, 10, 15, 20} results in:", o:["40","45","50","55"], c:2},

{t:"Swing Clickable Button", q:"Which Swing component is primarily used to create a clickable button?", o:["JLabel","JButton","JFrame","JTextField"], c:1},

{t:"JFrame Purpose", q:"What is the primary purpose of a JFrame?", o:["To display non-editable text","To represent the main window of a Swing application","To handle button clicks","To store array data"], c:1},

{t:"Displaying Text in Swing", q:"Which Swing component is commonly used to display non-editable text?", o:["JTextField","JButton","JLabel","JComboBox"], c:2},

{t:"Single-Line Text Input", q:"Which component allows a user to enter a single line of text?", o:["JLabel","JTextField","JButton","JFrame"], c:1},

{t:"Drop-Down Selection", q:"Which Swing component is appropriate when the user needs to select one item from a drop-down list?", o:["JButton","JComboBox","JLabel","JPanel"], c:1},

{t:"JOptionPane Dialogs", q:"What is the purpose of JOptionPane?", o:["To arrange components in a grid","To display dialog boxes","To store array data","To define classes"], c:1},

{t:"Button Click Response", q:"To make a button respond to a click, the required feature is:", o:["Inheritance","Event handling","Array traversal","Method overloading"], c:1},

{t:"Handling Button Clicks", q:"Which listener is commonly used to handle a JButton click?", o:["KeyListener","ActionListener","MouseMotionListener","WindowListener"], c:1},

{t:"Action Listener Execution", q:"When the save button with the specified action listener is clicked, what is displayed in the console?", o:["\"Loading...\"","\"Saved!\"","\"Error!\"","Nothing"], c:1},

{t:"Form Submission Event", q:"When the Save button is clicked on a form, the program should:", o:["Ignore the click","Execute code associated with the button's event","Close the application","Reset all fields automatically"], c:1},

{t:"Layout Manager Purpose", q:"What is the main purpose of a layout manager in Java Swing?", o:["To store data permanently","To automatically arrange components inside a container","To handle button click events","To define object attributes"], c:1},

{t:"FlowLayout Manager", q:"Which layout manager arranges components from left to right, moving to the next line when necessary?", o:["BorderLayout","FlowLayout","GridLayout","BoxLayout"], c:1},

{t:"BorderLayout Manager", q:"Which layout manager divides a container into NORTH, SOUTH, EAST, WEST, and CENTER regions?", o:["FlowLayout","GridLayout","BorderLayout","BoxLayout"], c:2},

{t:"GridLayout Manager", q:"Which layout manager is suitable for creating a calculator-style grid?", o:["FlowLayout","GridLayout","BorderLayout","BoxLayout"], c:1},

{t:"BoxLayout Manager", q:"BoxLayout is best described as a layout manager that:", o:["Divides a container into five regions","Arranges components along a horizontal or vertical axis","Creates drop-down menus","Displays dialog boxes"], c:1},

{t:"Arranging Buttons Horizontally", q:"To make the buttons Save, Update, and Delete appear next to each other, a simple layout choice is:", o:["BorderLayout","FlowLayout","GridLayout","BoxLayout (vertical)"], c:1},

{t:"BorderLayout Main Content", q:"In a JFrame using BorderLayout, the main content area should normally be placed in the:", o:["NORTH region","CENTER region","EAST region","SOUTH region"], c:1},

{t:"JPanel Utility", q:"Why are JPanels useful when designing Swing interfaces?", o:["They allow developers to group components and use different layouts","They automatically save form data","They replace the need for JFrame","They handle network requests"], c:0},

{t:"Complex GUI Design", q:"For a login screen with a title at the top, form in the center, and buttons at the bottom, the most appropriate approach is:", o:["Use one JLabel for everything","Use multiple JPanels with appropriate layout managers","Avoid using any layout manager","Use only GridLayout for the whole frame"], c:1},

{t:"Equal Grid Arrangement", q:"To arrange four buttons with equal width and height in a 2x2 grid, the most appropriate layout is:", o:["FlowLayout","BorderLayout","GridLayout","BoxLayout"], c:2},

{t:"Java Class Definition", q:"In Java, a class is defined as:", o:["An instance of an object","A blueprint for creating objects","A method that returns values","A type of array"], c:1},

{t:"Java Object Definition", q:"An object is defined as:", o:["A blueprint for a class","An instance of a class","A static method","A return type"], c:1},

{t:"Object Instantiation", q:"Which statement correctly creates an object from the Student class?", o:["<code>Student = new student1();</code>","<code>Student student1 = new Student();</code>","<code>new Student student1();</code>","<code>student1 Student = new();</code>"], c:1},

{t:"Class Attributes", q:"In the Car class, which of the following is an attribute?", o:["<code>drive()</code>","<code>brand</code>","<code>start()</code>","<code>stop()</code>"], c:1},

{t:"Class vs. Object", q:"The relationship between a class and an object is best described as:", o:["A class is an instance of an object","A class is a blueprint, while an object is an instance created from that blueprint","They are the same thing","An object defines the class structure"], c:1},

{t:"Calling Object Methods", q:"Which statement correctly calls the introduce() method for an object named student1?", o:["<code>introduce(student1);</code>","<code>student1.introduce();</code>","<code>student1->introduce();</code>","<code>Student.introduce(student1);</code>"], c:1},

{t:"Object Instance Values", q:"When two objects are created from the same Student class, they:", o:["Must always share identical values","Can contain different values for their instance attributes","Cannot be created independently","Automatically merge into one object"], c:1},

{t:"Modeling with Classes", q:"To model a vehicle in a rental application, the design that best demonstrates the use of a class is:", o:["A single global variable for all vehicles","A Vehicle class containing attributes like brand, model, and plateNumber, along with related methods","An array of Strings only","A JButton for each vehicle"], c:1},

{t:"Using Class Methods", q:"Which code correctly uses the Calculator class to calculate 10 + 20?", o:["<code>Calculator.add(10, 20);</code>","<code>Calculator c = new Calculator(); c.add(10, 20);</code>","<code>add(Calculator, 10, 20);</code>","<code>int c = Calculator(10, 20);</code>"], c:1},

{t:"Applying OOP Concepts", q:"When designing a clinic appointment GUI, the approach that best applies classes and objects is to:", o:["Use only static methods with no classes","Create one class named Appointment, then create separate objects for each appointment","Store all appointments as Strings in an array","Avoid using classes entirely"], c:1}
];

let order = [];
let current = 0;
let score = 0;
let answered = false;
let userAnswers = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(){
  order = shuffle(QUESTIONS.map((_, i) => i));
  current = 0;
  score = 0;
  userAnswers = [];
  document.getElementById('intro').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const idx = order[current];
  const item = QUESTIONS[idx];

  document.getElementById('qCounter').textContent = `Question ${current + 1} / ${QUESTIONS.length}`;
  document.getElementById('qScoreLive').textContent = `Score: ${score}`;
  document.getElementById('progressFill').style.width = `${(current / QUESTIONS.length) * 100}%`;
  document.getElementById('qTopic').textContent = item.t;
  document.getElementById('qText').innerHTML = item.q;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = (current === QUESTIONS.length - 1) ? 'See results' : 'Next question';

  // Shuffle option order each time this question is shown, tracking the new correct index.
  const optionOrder = shuffle(item.o.map((_, i) => i));
  const shuffledCorrectIndex = optionOrder.indexOf(item.c);

  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  optionOrder.forEach((origIndex, displayIndex) => {
    const el = document.createElement('div');
    el.className = 'opt';
    el.innerHTML = `<span class="letter">${letters[displayIndex]}</span><span>${item.o[origIndex]}</span>`;
    el.onclick = () => selectAnswer(displayIndex, idx, el, shuffledCorrectIndex);
    box.appendChild(el);
  });
}

function selectAnswer(i, idx, el, correctDisplayIndex){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  const correct = i === correctDisplayIndex;
  if(correct) score++;

  userAnswers.push({ idx, correct });

  const opts = document.querySelectorAll('#optionsBox .opt');
  opts.forEach((o, oi) => {
    o.classList.add('locked');
    if(oi === correctDisplayIndex) o.classList.add('correct');
    else if(oi === i) o.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  const correctText = opts[correctDisplayIndex].querySelector('span:last-child').textContent;
  fb.textContent = correct ? 'Correct.' : `Incorrect — correct answer is "${correctText}".`;
  fb.className = 'feedback ' + (correct ? 'correct' : 'wrong');

  document.getElementById('qScoreLive').textContent = `Score: ${score}`;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  if(!answered) return;
  current++;
  if(current >= QUESTIONS.length){
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults(){
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  const pct = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById('scoreBig').textContent = `${pct}%`;
  document.getElementById('scoreSub').textContent = `${score} / ${QUESTIONS.length} correct`;

  let verdict;
  if(pct >= 90) verdict = "Excellent — you know these notes cold.";
  else if(pct >= 75) verdict = "Solid grasp. Review the missed topics below.";
  else if(pct >= 50) verdict = "Getting there — go over the misses before the exam.";
  else verdict = "Time for another pass through the notes.";
  document.getElementById('verdict').textContent = verdict;

  const missed = userAnswers.filter(a => !a.correct);
  const breakdown = document.getElementById('breakdown');
  if(missed.length === 0){
    breakdown.innerHTML = '<div class="breakdown-row hit"><span class="r-topic">No misses — perfect run.</span><span class="r-mark">✓</span></div>';
  } else {
    const seen = new Set();
    let rows = '';
    missed.forEach(m => {
      const t = QUESTIONS[m.idx].t;
      if(seen.has(t)) return;
      seen.add(t);
      rows += `<div class="breakdown-row miss"><span class="r-topic">${t}</span><span class="r-mark">missed</span></div>`;
    });
    breakdown.innerHTML = rows;
  }
}

function restartQuiz(){
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('intro').style.display = 'block';
}
</script>
</body>
</html>
